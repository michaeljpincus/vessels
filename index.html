<!DOCTYPE html> 
<html lang="en">
    <head>
        <title>Vessels</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap">
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@100..900&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.12.0/dist/maplibre-gl.css" />
        <link rel="stylesheet" href="css/styles.css">

        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    </head>

    <body>
        <div id="map"></div>
        <div id="title-card">
            <h1 class="title">Tracking the Shadow Fleet, Oct 2025-2026</h1>
            <p class="subtitle">Click on a vessel to follow it through time</p>
            <div class="meta">
                <ul class="key">
                    <li><span class="key-dot key-port"></span>Port visit</li>
                    <li><span class="key-dot key-loiter"></span>Loitering</li>
                    <li><span class="key-dot key-last"></span>Last known location</li>
                </ul>
            </div>
        </div>
        <div id="panel">
            <div id="date"></div>
            <input id="slider" type="range" />
            <div class="row">
                <button id="play" class="play-btn" type="button">
                    <svg class="play-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                        <path class="icon-play" d="M6 4l14 8-14 8z" fill="currentColor"/>
                        <path class="icon-pause" d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor"/>
                    </svg>
                    <span class="play-label">Play</span>
                </button>
                <label><input type="checkbox" id="lastKnown" checked /> Show last known position between events</label>
            </div>
        </div>

        <footer id="footer">Source: Global Fishing Watch</footer>


        <script type="module" src="js/main.js"></script>
    </body>
